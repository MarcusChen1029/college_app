name: CI

# The same checks CLAUDE.md asks for before a commit. Builds never touch Supabase; the env file holds only
# the public URL and publishable key, copied from web/.env.example.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: cp .env.example .env.local
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  extension:
    name: extension (test, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            web/package-lock.json
      - run: npm ci
      # The extension type-checks and bundles code from web/lib, which imports react and supabase-js from web/node_modules.
      - run: npm ci
        working-directory: web
      - run: npm test
      - run: npx tsc --noEmit
      - run: node build.mjs
